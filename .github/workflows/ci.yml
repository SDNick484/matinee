name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (shellcheck + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # CI-only tools, pinned so a new release cannot turn the job red on its own. Not runtime dependencies.
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.9" "shellcheck-py==0.11.0.1"

      - name: shellcheck (POSIX sh)
        run: |
          shellcheck -s sh installer/setup-head.sh installer/build.sh ops/matinee-backup ops/matinee-refresh ops/matinee-restore-test

      - name: ruff check
        run: |
          ruff check .

  ui-smoke:
    name: UI smoke (Playwright + Chromium, 412 px)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      # Playwright is installed here only: the Python matrix and the Alpine job skip every tests/*_ui.py.
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium

      - name: Run the UI smoke tests
        run: |
          python -m pytest -v -rs --junitxml=ui-smoke.xml tests/*_ui.py

      # importorskip and the "Chromium won't launch" skip would otherwise let this job pass without rendering anything.
      - name: Fail if any smoke test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("ui-smoke.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              sys.exit("ui-smoke must run every test in tests/*_ui.py; none may be skipped")
          PY

  test-python:
    name: Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest test suite
        run: |
          python -m pytest -v --junitxml=pytest.xml

      # importorskip would let the MCP tests skip silently in this job; a skip here fails the job.
      - name: Fail if an MCP test was skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = [c for c in ET.parse("pytest.xml").getroot().iter("testcase")
                   if "test_mcp_http" in c.get("classname", "") or "test_mcp_server" in c.get("classname", "")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"mcp tests={len(cases)} skipped={len(skipped)}")
          if not cases or skipped:
              sys.exit(f"tests/test_mcp_http.py and tests/test_mcp_server.py must run without skips: {skipped}")
          PY

      - name: Verify JavaScript syntax (every ES module in static/js/)
        run: |
          for f in static/js/*.js; do node --check "$f"; done
          node --check static/sw.js   # the service worker: a classic script, so it lives outside static/js/
          # Without static/js/package.json ("type": "module"), node --check exits 0 on a broken file that uses
          # `import`. Prove the marker still makes Node parse modules: a broken copy beside it must be rejected.
          t=$(mktemp -d)
          cp static/js/package.json static/js/core.js "$t/"
          echo 'const x = ;' >> "$t/core.js"
          if node --check "$t/core.js" 2>/dev/null; then echo "node --check accepted a broken module" >&2; exit 1; fi

  test-alpine:
    name: Alpine Linux Container (production parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: alpine:latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Alpine packages
        run: |
          apk add --no-cache \
            python3 \
            py3-flask \
            py3-jwt \
            py3-cryptography \
            py3-pytest \
            py3-pip \
            sqlite \
            nodejs \
            git \
            bash \
            tar

      - name: Install FastMCP and the HTTP MCP stack for Python
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages -r requirements-mcp.txt anyio httpx

      - name: Run pytest under Alpine (musl libc + apk packages)
        run: |
          python3 -m pytest -v

      - name: Build self-extracting installer
        run: |
          sh installer/build.sh

      - name: Verify installer syntax
        run: |
          sh -n dist/setup-matinee.sh

      - name: Verify JavaScript syntax under Alpine (every ES module in static/js/)
        run: |
          for f in static/js/*.js; do node --check "$f"; done
          node --check static/sw.js   # the service worker: a classic script, so it lives outside static/js/
          # Without static/js/package.json ("type": "module"), node --check exits 0 on a broken file that uses
          # `import`. Prove the marker still makes Node parse modules: a broken copy beside it must be rejected.
          t=$(mktemp -d)
          cp static/js/package.json static/js/core.js "$t/"
          echo 'const x = ;' >> "$t/core.js"
          if node --check "$t/core.js" 2>/dev/null; then echo "node --check accepted a broken module" >&2; exit 1; fi

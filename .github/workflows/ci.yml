name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    name: Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest test suite
        run: |
          python -m pytest -v

      - name: Verify JavaScript syntax
        run: |
          node -c static/app.js

  test-alpine:
    name: Alpine Linux Container (production parity)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Alpine packages
        run: |
          apk add --no-cache \
            python3 \
            py3-flask \
            py3-jwt \
            py3-cryptography \
            py3-pytest \
            py3-pip \
            sqlite \
            nodejs \
            bash \
            tar

      - name: Install FastMCP and the HTTP MCP stack for Python
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages "mcp>=2.3,<3" "uvicorn>=0.31" "pyjwt[crypto]>=2.10" anyio httpx

      - name: Run pytest under Alpine (musl libc + apk packages)
        run: |
          python3 -m pytest -v

      - name: Build self-extracting installer
        run: |
          sh installer/build.sh

      - name: Verify installer syntax
        run: |
          sh -n dist/setup-matinee.sh

      - name: Verify JavaScript syntax under Alpine
        run: |
          node -c static/app.js
